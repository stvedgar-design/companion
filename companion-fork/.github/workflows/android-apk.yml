name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Stage web assets
        run: npm run build:web

      - name: Create Android platform project when missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Allow HTTP connections to the user-configured local model
        run: python3 tools/allow-kobold-http.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Give the APK a distinct download name
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Companion-Fork-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-fork-debug-apk
          path: dist/Companion-Fork-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: companion-fork-debug-apk
          path: dist

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Companion-Fork-debug.apk
